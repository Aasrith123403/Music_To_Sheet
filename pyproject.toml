[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-transcribe"
version = "0.1.0"
description = "Solo piano audio -> readable sheet music, with measurable readability."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "librosa>=0.10.1",
    "music21>=9.1.0",
    "mir_eval>=0.7",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# basic-pitch pulls in tensorflow; keep it optional so tests/import stay light.
transcribe = ["basic-pitch>=0.3.0"]
api = [
    "fastapi>=0.111.0", "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pretty_midi>=0.2.10", "pymupdf>=1.24.0",
    "bcrypt>=4.0.0",   # password hashing
    "httpx>=0.27.0",   # Google OAuth token/userinfo calls
    "python-dotenv>=1.0.0",  # load .env at startup
]
eval = ["pretty_midi>=0.2.10"]
omr = ["oemer>=0.1.7"]  # optical music recognition for PDF/image sheet input
# Torch-backed extra: a piano-specific transcription model, far more accurate
# than basic-pitch (~2.5 GB with torch).
piano = ["torch>=2.0", "piano_transcription_inference>=0.0.6", "setuptools"]
dev = ["pytest>=8.0.0", "pretty_midi>=0.2.10", "pymupdf>=1.24.0"]

[project.scripts]
piano-eval = "cli.run_eval:main"

[tool.setuptools]
packages = ["piano_transcribe", "api", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
